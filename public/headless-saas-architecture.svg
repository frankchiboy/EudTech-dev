<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">EudTech Headless SaaS and Notion integration architecture</title>
  <desc id="description">Notion and existing SaaS connect through events and APIs to EudTech policy controls, then to a branded portal, website, or AI agent.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#083344"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <text x="110" y="135" fill="#67e8f9" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="6">HEADLESS SAAS × NOTION</text>
  <text x="110" y="220" fill="#ffffff" font-family="Arial, sans-serif" font-size="55" font-weight="700">Keep the work layer. Build the right experience.</text>
  <text x="110" y="270" fill="#94a3b8" font-family="Arial, sans-serif" font-size="25">Authorised APIs · Event-driven workflows · Human approval · Traceable actions</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(110 390)">
      <rect width="300" height="235" rx="28" fill="#ffffff"/>
      <rect x="28" y="28" width="58" height="58" rx="15" fill="#0f172a"/>
      <text x="57" y="68" fill="#67e8f9" font-size="27" font-weight="700" text-anchor="middle">N</text>
      <text x="28" y="125" fill="#64748b" font-size="18" font-weight="700" letter-spacing="2">CONTENT &amp; WORK</text>
      <text x="28" y="167" fill="#0f172a" font-size="29" font-weight="700">Notion / SaaS</text>
      <text x="28" y="204" fill="#475569" font-size="19">Pages, databases, tasks</text>
    </g>
    <path d="M430 508 H520" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
    <path d="M505 493 L525 508 L505 523" fill="none" stroke="#67e8f9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(545 390)">
      <rect width="300" height="235" rx="28" fill="#ecfeff" stroke="#22d3ee" stroke-width="3"/>
      <circle cx="57" cy="57" r="29" fill="#0e7490"/>
      <path d="M44 57h26M57 44v26" stroke="#cffafe" stroke-width="6" stroke-linecap="round"/>
      <text x="28" y="125" fill="#0e7490" font-size="18" font-weight="700" letter-spacing="2">EVENT &amp; API</text>
      <text x="28" y="167" fill="#0f172a" font-size="29" font-weight="700">Secure integration</text>
      <text x="28" y="204" fill="#475569" font-size="19">OAuth, webhook, validation</text>
    </g>
    <path d="M865 508 H955" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
    <path d="M940 493 L960 508 L940 523" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(980 390)">
      <rect width="300" height="235" rx="28" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/>
      <circle cx="57" cy="57" r="29" fill="#047857"/>
      <path d="M45 57l8 8 17-20" fill="none" stroke="#d1fae5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="125" fill="#047857" font-size="18" font-weight="700" letter-spacing="2">EUDTECH CONTROL</text>
      <text x="28" y="167" fill="#0f172a" font-size="29" font-weight="700">Policy &amp; AI actions</text>
      <text x="28" y="204" fill="#475569" font-size="19">Permissions, approval, audit</text>
    </g>
    <path d="M1300 508 H1360" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
    <path d="M1345 493 L1365 508 L1345 523" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(1385 390)">
      <rect width="150" height="235" rx="28" fill="#f5f3ff" stroke="#a78bfa" stroke-width="3"/>
      <rect x="28" y="28" width="58" height="58" rx="15" fill="#6d28d9"/>
      <rect x="42" y="42" width="30" height="22" rx="4" fill="none" stroke="#ede9fe" stroke-width="5"/>
      <text x="28" y="125" fill="#6d28d9" font-size="15" font-weight="700" letter-spacing="1">BRANDED</text>
      <text x="28" y="163" fill="#0f172a" font-size="24" font-weight="700">Portal</text>
      <text x="28" y="196" fill="#0f172a" font-size="24" font-weight="700">Website</text>
      <text x="28" y="229" fill="#0f172a" font-size="24" font-weight="700">Agent</text>
    </g>
  </g>
  <g transform="translate(110 705)" font-family="Arial, sans-serif">
    <rect width="1425" height="95" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="36" y="58" fill="#cbd5e1" font-size="22">Source page · Event ID · Version · Action · Approver · Execution result</text>
  </g>
</svg>
