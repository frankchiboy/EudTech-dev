name: One-time deploy Taipei Public Art

on:
  push:
    branches: [main]
    paths: [netlify-public-art-trigger.txt]
  pull_request:
    branches: [main]
    paths: [netlify-public-art-pr-trigger.txt]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_ID: 9b0339fd-8ff9-4ab3-98e0-759b2ed37a0c
      PACKAGE_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-60a4-8209-a253-82cde8037af2/raw?se=2026-08-23T04%3A44%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=9ddec34a-755b-5adb-950c-598f42ca0742&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-23T01%3A52%3A05Z&ske=2026-08-24T01%3A52%3A05Z&sks=b&skv=2026-02-06&sig=5a4YxN%2BGNCUVBRbD0EZguu3g1EFL0vL%2B8vSCzX%2BEwNY%3D"
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Check Netlify credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NETLIFY_AUTH_TOKEN"

      - name: Download and verify package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$PACKAGE_URL" --output site.zip
          test "$(stat -c%s site.zip)" -gt 100000
          unzip -t site.zip
          mkdir site
          unzip -q site.zip -d site
          test -f site/index.html
          test -f site/admin.html
          echo "PACKAGE_SHA256=$(sha256sum site.zip | awk '{print $1}')"

      - name: Deploy production site
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx --yes netlify-cli@latest deploy --dir=site --prod --site="$SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --json > deploy-result.json
          cat deploy-result.json
          python - <<'PY'
          import json, os
          data=json.load(open('deploy-result.json',encoding='utf-8'))
          url=data.get('url') or data.get('deploy_url') or data.get('ssl_url')
          deploy_id=data.get('deploy_id') or data.get('id')
          if not url or not deploy_id:
              raise SystemExit(f'Incomplete Netlify response: {data}')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f'url={url}\n')
              f.write(f'deploy_id={deploy_id}\n')
          PY

      - name: Validate live pages
        shell: bash
        run: |
          set -euo pipefail
          url='${{ steps.deploy.outputs.url }}'
          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error --location "$url/" --output live-index.html && break
            sleep 2
          done
          grep -q '臺北社宅公共藝術平臺' live-index.html
          curl --fail --silent --show-error --location "$url/admin.html" --output live-admin.html
          grep -q '內容管理後臺' live-admin.html
          echo "PRODUCTION_URL=$url"
          echo "DEPLOY_ID=${{ steps.deploy.outputs.deploy_id }}"

      - name: Preserve deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: netlify-public-art-deployment
          path: |
            deploy-result.json
            live-index.html
            live-admin.html
          retention-days: 1
