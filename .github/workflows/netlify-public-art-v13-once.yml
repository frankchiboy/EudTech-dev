name: One-time deploy Taipei Public Art v1.3

on:
  pull_request:
    branches: [main]
    paths:
      - netlify-public-art-v13/**
      - netlify-public-art-v13-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SITE_ID: 9b0339fd-8ff9-4ab3-98e0-759b2ed37a0c
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Check out proposed upgrade
        uses: actions/checkout@v4

      - name: Confirm deployment credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NETLIFY_AUTH_TOKEN"

      - name: Build v1.3 from verified production baseline
        shell: bash
        run: |
          set -euo pipefail
          python netlify-public-art-v13/build-site.py
          test -f site/index.html
          test -f site/admin.html
          test -f site/netlify.toml
          test -f site/data/photo-sources.json
          test -f site/assets/accessibility-extreme.js
          test -f site/assets/accessibility-extreme.css

      - name: Static accessibility and source audit
        shell: bash
        run: |
          set -euo pipefail
          node --check site/assets/accessibility-extreme.js
          node --check site/assets/app.js
          node --check site/assets/admin.js
          python - <<'PY'
          from pathlib import Path
          import json,re,tomllib
          root=Path('site'); errors=[]
          photos=json.loads((root/'data/photo-sources.json').read_text(encoding='utf-8'))['photos']
          if len(photos)<12: errors.append(f'photo sources: {len(photos)}')
          for p in photos:
              for k in ('original_url','source_page','credit','alt','long_description'):
                  if not p.get(k): errors.append(f'{p.get("key")} missing {k}')
              if len(p['alt'])<10 or len(p['long_description'])<25: errors.append(f'{p["key"]} description too short')
          for name in ('index.html','admin.html','photo-sources.html','accessibility-conformance.html'):
              text=(root/name).read_text(encoding='utf-8')
              if 'lang="zh-Hant-TW"' not in text: errors.append(f'{name} language')
              if 'accessibility-extreme' not in text: errors.append(f'{name} enhancement missing')
          cfg=tomllib.loads((root/'netlify.toml').read_text(encoding='utf-8'))
          if len(cfg.get('images',{}).get('remote_images',[]))<2: errors.append('remote image allowlist')
          seed=json.loads((root/'data/seed.json').read_text(encoding='utf-8'))
          blob=json.dumps(seed,ensure_ascii=False)
          if blob.count('/.netlify/images?')<12: errors.append('insufficient Image CDN references')
          if errors: raise SystemExit('\n'.join(errors))
          print(json.dumps({'photos':len(photos),'image_cdn_refs':blob.count('/.netlify/images?'),'status':'pass'},ensure_ascii=False))
          PY

      - name: Start local preview
        shell: bash
        run: |
          python -m http.server 8767 --directory site >/tmp/public-art-v13-http.log 2>&1 &
          echo $! > /tmp/public-art-v13-http.pid
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:8767/ >/dev/null && exit 0; sleep .2; done
          cat /tmp/public-art-v13-http.log
          exit 1

      - name: Browser accessibility audit
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright-core axe-core >/dev/null
          cat > /tmp/audit.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const cases=[['home','http://127.0.0.1:8767/'],['artworks','http://127.0.0.1:8767/#/artworks'],['admin','http://127.0.0.1:8767/admin.html']];
          const report={pages:{},violations:[]};
          for(const [name,url] of cases){
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            await page.route('**/.netlify/images?**',r=>r.fulfill({status:200,contentType:'image/svg+xml',body:'<svg xmlns="http://www.w3.org/2000/svg" width="16" height="10"><rect width="16" height="10" fill="#dcebe5"/></svg>'}));
            await page.goto(url,{waitUntil:'domcontentloaded'});await page.waitForTimeout(1200);
            await page.addScriptTag({path:'node_modules/axe-core/axe.min.js'});
            const result=await page.evaluate(async()=>await axe.run(document,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21a','wcag21aa','wcag22aa','best-practice']}}));
            const serious=result.violations.filter(v=>['critical','serious'].includes(v.impact));
            const dom=await page.evaluate(()=>{const visible=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0};const targets=[...document.querySelectorAll('button,input,select,textarea,.btn,.icon-btn,[role="button"],nav a,summary')].filter(visible);return{lang:document.documentElement.lang,noAlt:[...document.images].filter(i=>visible(i)&&!i.hasAttribute('alt')).length,small:targets.filter(e=>{const r=e.getBoundingClientRect();return r.width<44||r.height<44}).length,photos:document.querySelectorAll('img[data-public-photo="true"]').length,srcsets:document.querySelectorAll('img[data-public-photo="true"][srcset]').length,descriptions:document.querySelectorAll('img[data-public-photo="true"][aria-describedby]').length,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}});
            report.pages[name]={serious:serious.map(v=>({id:v.id,impact:v.impact,nodes:v.nodes.length})),all:result.violations.map(v=>({id:v.id,impact:v.impact,nodes:v.nodes.length})),dom};
            if(serious.length||dom.noAlt||dom.small||dom.overflow>2||(name==='artworks'&&dom.photos<10)){report.violations.push({name,serious:report.pages[name].serious,dom})}
            await page.screenshot({path:`${name}-v13.png`,fullPage:true});await page.close();
          }
          await browser.close();fs.writeFileSync('browser-a11y-report.json',JSON.stringify(report,null,2));
          if(report.violations.length){console.error(JSON.stringify(report,null,2));process.exit(1)}
          console.log(JSON.stringify(report,null,2));
          JS
          node /tmp/audit.mjs

      - name: Deploy production site
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          cd site
          npx --yes netlify-cli@latest deploy --dir=. --prod --site="$SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --json > ../deploy-result.json
          cd ..
          cat deploy-result.json
          python - <<'PY'
          import json,os
          d=json.load(open('deploy-result.json',encoding='utf-8'))
          url=d.get('url') or d.get('deploy_url') or d.get('ssl_url'); deploy=d.get('deploy_id') or d.get('id')
          if not url or not deploy: raise SystemExit(d)
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:f.write(f'url={url}\ndeploy_id={deploy}\n')
          PY

      - name: Validate production, public photos, and Image CDN
        shell: bash
        run: |
          set -euo pipefail
          url='${{ steps.deploy.outputs.url }}'
          for i in $(seq 1 40); do curl -fsSL "$url/" -o live-index.html && break; sleep 2; done
          grep -q '臺北社宅公共藝術平臺' live-index.html
          grep -q 'accessibility-extreme.css' live-index.html
          curl -fsSL "$url/admin.html" -o live-admin.html
          grep -q '內容管理後臺' live-admin.html
          curl -fsSL "$url/photo-sources.html" -o live-photo-sources.html
          grep -q '影像來源與替代文字' live-photo-sources.html
          image_path=$(python - <<'PY'
          from urllib.parse import quote
          u='https://udd.gov.taipei/assets/cwKMfUf6TBX5ToyM5uoTif/images/d839ee1a-94ae-41cd-9aeb-6f152abac6d9.jpg'
          print('/.netlify/images?url='+quote(u,safe='')+'&w=480&h=300&fit=cover&fm=webp&q=84')
          PY
          )
          curl -fsSL -D image-headers.txt "$url$image_path" -o transformed-image.webp
          test "$(stat -c%s transformed-image.webp)" -gt 1000
          grep -qi 'content-type: image/' image-headers.txt
          echo "PRODUCTION_URL=$url"
          echo "DEPLOY_ID=${{ steps.deploy.outputs.deploy_id }}"

      - name: Lighthouse accessibility validation
        shell: bash
        run: |
          set -euo pipefail
          url='${{ steps.deploy.outputs.url }}'
          npx --yes lighthouse "$url/" --only-categories=accessibility --chrome-flags='--headless --no-sandbox' --output=json --output-path=lighthouse-accessibility.json --quiet
          python - <<'PY'
          import json
          d=json.load(open('lighthouse-accessibility.json'))
          score=d['categories']['accessibility']['score']
          print('LIGHTHOUSE_ACCESSIBILITY_SCORE=',score)
          if score < 0.98: raise SystemExit(f'accessibility score {score}')
          PY

      - name: Preserve deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netlify-public-art-v13-evidence
          path: |
            deploy-result.json
            browser-a11y-report.json
            lighthouse-accessibility.json
            live-index.html
            live-admin.html
            live-photo-sources.html
            image-headers.txt
            home-v13.png
            artworks-v13.png
            admin-v13.png
          retention-days: 2
