name: Development Policy Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'codex/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Branch policy and production build
    runs-on: ubuntu-latest

    steps:
      - name: Require a short-lived codex branch for pull requests to main
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          case "$HEAD_REF" in
            codex/*) ;;
            *)
              echo "Pull requests to main must originate from a codex/* branch." >&2
              exit 1
              ;;
          esac

      - name: Checkout proposed version
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify original prompt archive
        run: npm run verify:original-prompts

      - name: Build production bundle without publishing
        run: npm run build

      - name: Write verification summary
        shell: bash
        run: |
          {
            echo "## Development policy check"
            echo "- Ref: \`${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}\`"
            echo "- Original prompt archive: passed"
            echo "- Production build: passed"
            echo "- Deployment performed: no"
          } >> "$GITHUB_STEP_SUMMARY"
